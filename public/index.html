<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTPUNE</title>
  <style>
    html, body { height: 100%; margin: 0; background: #14110e; color: #f5f0e6; font-family: system-ui, sans-serif; }
    #game { width: 100%; height: 100%; display: block; }
    #hud { position: fixed; inset: 0 auto 0 0; width: min(18rem, 92vw); padding: 1rem; pointer-events: none; }
    #hud button, #hud p, #hud li, #hud h1 { pointer-events: auto; }
    h1 { margin: 0 0 0.2rem; font-size: 1.6rem; }
    p, li { margin: 0.3rem 0; line-height: 1.35; }
    #areas { list-style: none; padding: 0; }
    #areas button { width: 100%; text-align: left; margin: 0.15rem 0; padding: 0.35rem 0.5rem; border-radius: 0.4rem; border: 1px solid #d6d3d1; background: #fff; color: #1c1917; font: inherit; }
    #line { min-height: 2.6rem; }
    #look { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); margin: 0; padding: 0.55rem 0.9rem; border-radius: 999px; background: rgba(20, 17, 14, 0.72); color: #fff; pointer-events: none; }
    #look[hidden] { display: none; }
    #status { position: fixed; left: 1rem; bottom: 1rem; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "@dimforge/rapier3d-compat": "/vendor/rapier/rapier.es.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <aside id="hud">
    <h1>GTPUNE</h1>
    <p>Chapter 1 is FC Road, Pune.</p>
    <ul id="areas">
      <li><button type="button" data-area="kothrud">Kothrud — Locked</button></li>
      <li><button type="button" data-area="karve-nagar">Karve Nagar — Locked</button></li>
      <li><button type="button" data-area="fc-road">FC Road — Chapter 1</button></li>
    </ul>
    <p id="cash">₹0</p>
    <p id="weather">Day</p>
    <p id="ride">On foot</p>
    <ul id="missions"></ul>
    <p id="line" aria-live="polite"></p>
    <p id="prompt"></p>
    <p>WASD move. Shift sprint. Space jump. Mouse look. E interact. F enter. H horn. N night. R rain.</p>
  </aside>
  <div id="look">Click the street to look</div>
  <p id="status">Loading FC Road</p>
  <script type="module" src="/game.js"></script>
</body>
</html>
